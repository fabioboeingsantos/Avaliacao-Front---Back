<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Flora — fluxo de evolução da assistente de IA</title>
<desc id="descricao">Mensagem, interpretar, especialista do perfil, validação local e decisão sobre informações faltantes. Se sim, perguntar e salvar estado, receber nova resposta e retornar ao especialista. Se não, revisão QA, prévia e confirmação, backend revalida e executa. A continuidade com estado está planejada.</desc>
<defs><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#387f68"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#bd7a20"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#183d32}.label{font-size:21px;font-weight:600;text-anchor:middle}.sub{font-size:15px;fill:#526c62;text-anchor:middle}.edge{font-size:18px;font-weight:600}.note{font-size:17px;fill:#526c62}</style>
<rect width="1280" height="1260" fill="#f3f8f5"/>
<rect x="0" y="0" width="1280" height="8" fill="#387f68"/>
<text x="70" y="60" font-size="16" font-weight="700" letter-spacing="2">CESTA DO VALE / ARQUITETURA DE IA</text>
<text x="70" y="103" font-size="32" font-weight="700">Flora · Da mensagem à confirmação</text>
<text x="70" y="137" class="note">Fluxo proposto · Continuidade com estado é uma evolução planejada</text>
<g><rect x="260" y="180" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="212" class="label">Mensagem</text><text x="480" y="235" class="sub">Pedido escrito pela pessoa usuária</text></g><path d="M480 254 V282" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><g><rect x="260" y="290" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="322" class="label">Interpretar</text><text x="480" y="345" class="sub">Identificar a intenção</text></g><path d="M480 364 V392" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><g><rect x="260" y="400" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="432" class="label">Especialista do perfil</text><text x="480" y="455" class="sub">Assinante ou produtor</text></g><path d="M480 474 V502" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><g><rect x="260" y="510" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="542" class="label">Validação local</text><text x="480" y="565" class="sub">Regras, permissões e dados da proposta</text></g><path d="M480 584 V612" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><path d="M480 620 L620 690 L480 760 L340 690 Z" fill="#e3f0e9" stroke="#387f68" stroke-width="2"/><text x="480" y="685" class="label">Faltam</text><text x="480" y="710" class="label">informações?</text><path d="M620 690 H1000 V752" fill="none" stroke="#bd7a20" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#amber)"/><text x="750" y="677" class="edge" fill="#bd7a20">Sim</text><g><rect x="795" y="760" width="410" height="74" rx="16" fill="#fff7e8" stroke="#bd7a20" stroke-width="2" stroke-dasharray="7 5"/><text x="1000" y="792" class="label">Perguntar e salvar estado</text><text x="1000" y="815" class="sub">Planejado: preservar a conversa</text></g><path d="M1000 834 V872" fill="none" stroke="#bd7a20" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#amber)"/><g><rect x="795" y="880" width="410" height="74" rx="16" fill="#fff7e8" stroke="#bd7a20" stroke-width="2" stroke-dasharray="7 5"/><text x="1000" y="912" class="label">Nova resposta do usuário</text><text x="1000" y="935" class="sub">Planejado: completar os dados</text></g><path d="M1205 917 H1240 V437 H708" fill="none" stroke="#bd7a20" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#amber)"/><path d="M480 760 V802" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><text x="502" y="792" class="edge">Não</text><g><rect x="260" y="810" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="842" class="label">Revisão QA</text><text x="480" y="865" class="sub">Coerência entre mensagem e proposta</text></g><path d="M480 884 V922" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><g><rect x="260" y="930" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="962" class="label">Prévia para confirmação</text><text x="480" y="985" class="sub">Pessoa usuária revisa e confirma</text></g><path d="M480 1004 V1042" fill="none" stroke="#387f68" stroke-width="3"  marker-end="url(#green)"/><g><rect x="260" y="1050" width="440" height="74" rx="16" fill="#ffffff" stroke="#9dc4b5" stroke-width="2" /><text x="480" y="1082" class="label">Backend revalida e executa</text><text x="480" y="1105" class="sub">Rotas existentes do sistema</text></g><rect x="70" y="1155" width="1140" height="76" rx="12" fill="#e6eeea"/>
<text x="94" y="1185" class="note">Fluxo atual: intérprete → especialista → QA → validação local → prévia e confirmação.</text>
<text x="94" y="1211" class="note">Etapas tracejadas: ainda não implementadas. Falhas e bloqueios não liberam a prévia.</text>
</svg>
